# Prometheus datasource (auto-provisioned into Grafana at startup).
# The uid MUST match the panels' datasource uid in dashboards/ebpf_telemetry.json.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
